[package]
name = "wordcraft-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft import/export: plain text, Markdown, HTML, RTF, OpenDocument Text and LaTeX"

[lints]
workspace = true

[features]
default = ["all-formats"]
all-formats = [
    "dep:wordcraft-metafile",
    "dep:quick-xml",
    "dep:zip",
    "dep:cfb",
    "dep:chrono",
    "dep:aes",
    "dep:sha1",
    "dep:sha2",
    "dep:hmac",
    "dep:getrandom",
    "dep:zeroize",
    "dep:miniz_oxide",
]

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-geom = { workspace = true, features = ["image"] }
wordcraft-metafile = { workspace = true, optional = true }
base64 = { workspace = true }
image = { workspace = true }
quick-xml = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
cfb = { workspace = true, optional = true }
encoding_rs = { workspace = true }
chardetng = { workspace = true }
log = { workspace = true }
chrono = { workspace = true, optional = true }
# Password-protected ODT (ODF 1.3 Part 2 §3.4): AES-256-CBC, SHA-1/SHA-256, PBKDF2 (HMAC-SHA-1).
aes = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
miniz_oxide = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# The browser's `crypto.getRandomValues` for the salts and vectors of encrypted saves.
getrandom = { workspace = true, features = ["wasm_js"], optional = true }

[dev-dependencies]
wordcraft-doc = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
