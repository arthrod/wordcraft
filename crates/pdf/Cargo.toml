[package]
name = "wordcraft-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft PDF export (craft-pdf / Krilla): embedded font subsets with selectable text, links, outline, tagging"

[lints]
workspace = true

[features]
default = ["writer"]
writer = [
    "dep:craft-pdf",
    "dep:wordcraft-fonts",
    "dep:craft-metafile",
    "dep:kurbo",
    "dep:image",
    "dep:log",
    "dep:chrono",
]

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-geom = { workspace = true, features = ["image"] }
wordcraft-fonts = { workspace = true, optional = true }
wordcraft-layout = { workspace = true, default-features = false }
craft-metafile = { workspace = true, optional = true }
craft-pdf = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }
image = { workspace = true, optional = true }
thiserror = { workspace = true }
log = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[dev-dependencies]
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
