# Build with: trunk build --release   (from apps/wordcraft-web)
[build]
target = "index.html"
dist = "../../dist/web"
public_url = "./"
filehash = true

[serve]
addresses = ["127.0.0.1"]
port = 8771

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "for f in \"$TRUNK_STAGING_DIR\"/*_bg.wasm; do wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals \"$f\" -o \"$f\" && gzip -9 -k -f \"$f\"; done"]
