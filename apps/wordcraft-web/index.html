<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Open-source word processor that runs entirely in your browser. Open, edit and save .docx, Markdown and plain text documents locally — no uploads, no sign-in.">
  <title>WordCraft</title>
  <link data-trunk rel="icon" href="../../assets/app-icon/wordcraft.ico" />
  <link data-trunk rel="copy-dir" href="target-assets/i18n" data-target-path="i18n" />
  <link data-trunk rel="copy-dir" href="target-assets/samples" data-target-path="samples" />
  <link data-trunk rel="copy-dir" href="target-assets/fonts" data-target-path="fonts" />
  <link data-trunk rel="copy-file" href="target-assets/robots.txt" />
  <link data-trunk rel="copy-file" href="target-assets/404.html" />
  <link data-trunk rel="rust" data-bin="wordcraft-web" data-cargo-profile="wasm-release" data-typescript data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6; font-family: system-ui, -apple-system, sans-serif; }
    #wordcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: none; background: #e6e6e6; color: #334155; z-index: 500; }
    .wc-skel-bar { height: 34px; background: #2b47b5; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 13px; font-weight: 600; }
    .wc-skel-ribbon { height: 76px; background: #f8fafc; border-bottom: 1px solid #cbd5e1; display: flex; align-items: center; gap: 12px; padding: 0 16px; }
    .wc-skel-pill { height: 14px; border-radius: 4px; background: #e2e8f0; }
    .wc-skel-page-wrap { flex: 1; display: flex; justify-content: center; padding: 28px 16px; overflow: hidden; }
    .wc-skel-page { width: min(720px, 92%); height: 100%; background: #ffffff; border: 1px solid #cbd5e1; box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08); padding: 48px 56px; box-sizing: border-box; }
    .wc-skel-line { height: 11px; border-radius: 3px; background: #eef2f6; margin-bottom: 12px; }
    .wc-skel-title { height: 22px; width: 52%; background: #e2e8f0; margin-bottom: 24px; border-radius: 4px; }
  </style>
</head>
<body>
  <canvas id="wordcraft_canvas"></canvas>
  <div id="wordcraft_loading" aria-live="polite">
    <div class="wc-skel-bar">
      <span>WordCraftWeb</span>
      <span style="font-weight: 400; opacity: 0.9;">Streaming WebAssembly runtime&hellip;</span>
    </div>
    <div class="wc-skel-ribbon">
      <div class="wc-skel-pill" style="width: 64px;"></div>
      <div class="wc-skel-pill" style="width: 96px;"></div>
      <div class="wc-skel-pill" style="width: 78px;"></div>
      <div class="wc-skel-pill" style="width: 110px;"></div>
    </div>
    <div class="wc-skel-page-wrap">
      <div class="wc-skel-page">
        <div class="wc-skel-title"></div>
        <div class="wc-skel-line" style="width: 94%;"></div>
        <div class="wc-skel-line" style="width: 88%;"></div>
        <div class="wc-skel-line" style="width: 91%;"></div>
        <div class="wc-skel-line" style="width: 62%;"></div>
      </div>
    </div>
  </div>
</body>
</html>
