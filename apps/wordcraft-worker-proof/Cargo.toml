[package]
name = "wordcraft-worker-proof"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft proofing dedicated worker (spelling and grammar squiggles off the main thread; deferred-items plan §3.2)"
publish = false

[lints]
workspace = true

[[bin]]
name = "wordcraft-worker-proof"
path = "src/main.rs"

[dependencies]
wordcraft-proof = { workspace = true }
wordcraft-worker-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# std HashMap/HashSet random seeds (wordcraft-proof's dictionaries) need a JS entropy source in the browser.
getrandom = { workspace = true, features = ["wasm_js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "ErrorEvent", "MessageEvent", "console"] }
