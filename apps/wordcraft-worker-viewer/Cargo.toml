[package]
name = "wordcraft-worker-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft view-only dedicated worker: opens a .docx and paints its pages off the main thread (plan 10.3)"
publish = false

[lints]
workspace = true

[[bin]]
name = "wordcraft-worker-viewer"
path = "src/main.rs"

[dependencies]
# The view-only core, as it is: this crate only puts the worker envelope around it.
wordcraft-viewer = { path = "../wordcraft-viewer" }
wordcraft-worker-proto = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# std HashMap/HashSet random seeds need a JS entropy source in the browser.
getrandom = { workspace = true, features = ["wasm_js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "ErrorEvent", "MessageEvent", "console"] }

[dev-dependencies]
wordcraft-doc = { workspace = true }
wordcraft-docx = { workspace = true }
# Packages a test .docx that embeds a font (the docx writer embeds none).
craft-zip = { workspace = true }
