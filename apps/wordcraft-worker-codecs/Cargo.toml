[package]
name = "wordcraft-worker-codecs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft codec dedicated worker (document format conversion off the main thread; deferred-items plan §3.3)"
publish = false

[lints]
workspace = true

[[bin]]
name = "wordcraft-worker-codecs"
path = "src/main.rs"

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-docx = { workspace = true }
wordcraft-docbin = { workspace = true }
wordcraft-formats = { workspace = true, features = ["all-formats"] }
wordcraft-worker-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Tests only: makes a document with a comment through the review commands.
wordcraft-engine = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# std HashMap/HashSet random seeds (the format tables') need a JS entropy source in the browser.
getrandom = { workspace = true, features = ["wasm_js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "ErrorEvent", "MessageEvent", "console"] }
