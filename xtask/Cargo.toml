[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
# Pack fonts ship Brotli-compressed (web-assets staging); `brotli` already compresses the
# bundled minimal-WASM faces in crates/fonts/build.rs.
brotli = "8"
# `cargo xtask wasm-attr`: demangle function names for the code-section attribution
# (MIT OR Apache-2.0, both on the house-rule allowlist).
rustc-demangle = "0.1"
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
brotli-decompressor = "5"
